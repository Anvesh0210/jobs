name: Deploy HEALNEXIA to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['healnexia/**', '.github/workflows/healnexia-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect public files only (no tests, tooling or source maps)
        working-directory: healnexia
        run: |
          mkdir -p ../_site
          cp -r index.html app.html styles.css src site assets ../_site/
          rm -f ../_site/site/styles.css
          touch ../_site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
